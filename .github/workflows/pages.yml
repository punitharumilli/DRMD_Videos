# Publishes the DRMD video guides on GitHub Pages.
# Every change on the main branch is published automatically.

name: Publish on GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - videos.js
      - assets/**
      - videos/**
      - .github/workflows/pages.yml
  # Allows a manual run from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one publication at a time; a running publication is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Prepare the site
        run: |
          for f in index.html videos.js assets videos; do
            if [ ! -e "$f" ]; then
              echo "::error::$f was not found in the root of the repository."
              exit 1
            fi
          done
          mkdir -p _site
          cp index.html videos.js _site/
          cp -r assets videos _site/

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v5
